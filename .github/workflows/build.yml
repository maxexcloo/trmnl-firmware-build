name: build-firmware

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to build (default: latest main)'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
      ref: ${{ steps.compare.outputs.ref }}
      short_sha: ${{ steps.compare.outputs.short_sha }}
      tag: ${{ steps.compare.outputs.tag }}
    steps:
      - name: Check for new commits
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Resolve the ref to build
          if [[ -n "${{ inputs.ref }}" ]]; then
            REF="${{ inputs.ref }}"
          else
            REF=$(curl -sf https://api.github.com/repos/maxexcloo/trmnl-firmware/commits/main | jq -r '.sha')
          fi
          SHORT="${REF:0:7}"

          # Find the last successfully built SHA from existing releases
          LAST_TAG=$(gh release list --repo "${{ github.repository }}" --limit 50 --json tagName \
            | jq -r '[.[] | .tagName | select(startswith("build-"))] | first // ""')
          LAST_SHORT="${LAST_TAG#build-}"

          echo "Current SHA: $SHORT  Last built: $LAST_SHORT"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$SHORT" != "$LAST_SHORT" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT" >> $GITHUB_OUTPUT

          # Use a tag name if the ref points to a tag, otherwise use short SHA
          TAG_NAME=$(curl -sf "https://api.github.com/repos/maxexcloo/trmnl-firmware/git/refs/tags" \
            | jq -r --arg sha "$REF" '.[] | select(.object.sha == $sha) | .ref | ltrimstr("refs/tags/")' | head -1)
          if [[ -n "$TAG_NAME" ]]; then
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          else
            echo "tag=build-$SHORT" >> $GITHUB_OUTPUT
          fi

  list-targets:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.list.outputs.environments }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: maxexcloo/trmnl-firmware
          ref: ${{ needs.check.outputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: List environments
        id: list
        run: echo "environments=$(python3 scripts/list_build_envs.py)" >> $GITHUB_OUTPUT

  build:
    needs: [check, list-targets]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.list-targets.outputs.environments) }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: maxexcloo/trmnl-firmware
          ref: ${{ needs.check.outputs.ref }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.buildcache
          key: ubuntu-pio-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ubuntu-pio-${{ matrix.environment }}-
            ubuntu-pio-

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ubuntu-ccache-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}
          job-summary: ''

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Configure ccache
        run: echo "PLATFORMIO_BUILD_CACHE_DIR=$HOME/.buildcache" >> $GITHUB_ENV

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: .pio/build/${{ matrix.environment }}/firmware.bin
          retention-days: 7

  release:
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: firmware/

      - name: Rename binaries
        run: |
          mkdir -p release/
          for dir in firmware/firmware-*/; do
            env="${dir#firmware/firmware-}"
            env="${env%/}"
            cp "$dir/firmware.bin" "release/${env}.bin"
          done
          ls -la release/

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.check.outputs.tag }}"
          SHORT="${{ needs.check.outputs.short_sha }}"
          if [[ "$TAG" == build-* ]]; then
            PRERELEASE="--prerelease"
          else
            PRERELEASE=""
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes "Built from [maxexcloo/trmnl-firmware@${SHORT}](https://github.com/maxexcloo/trmnl-firmware/commit/${{ needs.check.outputs.ref }})" \
            $PRERELEASE \
            release/*.bin
